# nginx.conf - single front door for the whole IDS site.
#
#   /            -> admin-console:8000  (login, Agents/Assets/Alerts tabs,
#                                         all Allow/Block/Investigate actions)
#   /dashboard/  -> dashboard:8501      (read-only Streamlit charts)
#
# Both services keep their own container ports (8000, 8501) reachable
# directly too, per docker-compose.yml, for local debugging - but on
# the real testbed server, point people at this proxy's port only
# (see PROXY_PORT in docker-compose.yml) so there's one URL to learn
# and one place to put TLS/auth later if you add it.
#
# Dashboard note: the Streamlit container is started with
# --server.baseUrlPath=dashboard (see dashboard/Dockerfile), so it
# already expects every request - pages, static assets, and its
# websocket - at /dashboard/... on its own port. That's why the
# location below passes the path straight through unchanged (no
# trailing path on proxy_pass) instead of stripping the /dashboard/
# prefix.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 20m;

    # Admin console - login page, REST API, static JS/CSS.
    upstream admin_console {
        server admin-console:8000;
    }

    # Streamlit dashboard.
    upstream dashboard {
        server dashboard:8501;
    }

    server {
        listen 80;

        # --- Streamlit dashboard, including its websocket stream ---
        # Streamlit's live-update connection (auto-refresh, widget
        # state) rides over a websocket at /dashboard/_stcore/stream.
        # Without the Upgrade/Connection headers below, nginx proxies
        # it as a plain HTTP request, the upgrade handshake fails, and
        # the dashboard silently falls back to "static page, never
        # refreshes" instead of erroring - worth remembering if a
        # future change to this file breaks auto-refresh.
        location /dashboard/ {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # --- Everything else: admin console (login, /api/*, /static/*) ---
        location / {
            proxy_pass http://admin_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
